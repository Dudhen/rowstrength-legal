<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RowStrength Legal</title>
  <meta name="description" content="Legal information for RowStrength.">
  <style>
:root{color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.65;background:#f7f7fb;color:#222}
main{max-width:860px;margin:0 auto;padding:48px 20px 72px}
article{background:#fff;border:1px solid #e7e7ef;border-radius:18px;padding:38px;box-shadow:0 8px 28px rgba(25,20,45,.06)}
h1{font-size:2rem;line-height:1.2;margin:0 0 10px}
h2{font-size:1.3rem;margin:32px 0 10px}
h3{font-size:1.05rem;margin:22px 0 8px}
p{margin:0 0 14px}
.meta{color:#666;margin-bottom:26px}
a{color:#5a3fa3}
footer{max-width:860px;margin:18px auto 0;color:#707070;font-size:.9rem;text-align:center}
@media(max-width:620px){main{padding:20px 12px 48px}article{padding:24px 18px;border-radius:14px}h1{font-size:1.65rem}}
@media(prefers-color-scheme:dark){
 body{background:#111116;color:#eee}
 article{background:#1a1a22;border-color:#2c2c39}
 .meta,footer{color:#aaa}
 a{color:#b9a9ff}
}
</style>
</head>
<body>
<main>
  <article>
    <h1>RowStrength Legal</h1>
    <p>Legal and privacy information for the RowStrength mobile application.</p>
    <p><a href="privacy.html">Privacy Policy</a></p>
  </article>
  <footer>© 2026 Arsenii Dudchenko · RowStrength</footer>
</main>
</body>
</html>
